[package]
name = "rust-database"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.12.0"
redis = { version = "1.7.1", features = ["tokio-comp"] }
tokio = { version = "1.54.0", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

# Enforce "no panics on client input" mechanically, not just by convention.
# Tests are exempted via clippy.toml.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
